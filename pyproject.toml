[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-computer-use-mcp"
version = "0.2.3"
description = "Windows desktop MCP server with translucent control indicator and fast screen capture"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "mcp>=2,<3",
    "mss>=10,<11",
    "Pillow>=11,<13",
    "PyAutoGUI>=0.9.54,<1",
    "pywinauto>=0.6.9,<0.7",
    "resvg-py>=0.5,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.14,<1"]
demo = ["imageio-ffmpeg>=0.6,<1"]

[project.scripts]
windows-computer-use = "windows_computer_use.server:main"
windows-computer-use-preview = "windows_computer_use.overlay:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["windows_computer_use*"]

[tool.setuptools.package-data]
windows_computer_use = ["assets/*.svg", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
